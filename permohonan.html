    <script src="script.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // --- KONFIGURASI FIREBASE ---
        // Ganti konfigurasi di bawah ini dengan milik Anda dari Firebase Console
        const firebaseConfig = {
            apiKey: "API_KEY_FIREBASE_ANDA",
            authDomain: "PROJECT_ID.firebaseapp.com",
            databaseURL: "https://PROJECT_ID-default-rtdb.firebaseio.com", // WAJIB SESUAI PROJECT ANDA
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.addEventListener('DOMContentLoaded', function() {
            // --- KONFIGURASI JSONBIN.IO ---
            const API_KEY = '$2a$10$h08CHo/2k.EXdddjlF1Jj.wgLWCrn5ygHtQqUzOj7fZxG5RFYTYl6';
            const BIN_ID = '69d70e6e36566621a892442d';
            const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
            // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
            const GOOGLE_SCRIPT_URL = ''; // <--- PASTE URL SCRIPT (https://script.google.com/...) DI SINI

            const serviceForm = document.getElementById('serviceForm');
            const btnTambahData = document.getElementById('btn-tambah-data');
            const btnTambahLagi = document.getElementById('btn-tambah-lagi');
            const btnKirim = document.getElementById('btn-kirim');
            const btnResetTabel = document.getElementById('btn-reset-tabel');
            const btnExportDropdown = document.getElementById('btn-export-dropdown');
            const btnDateFilterDropdown = document.getElementById('btn-date-filter-dropdown');
            const dateFilterMenu = document.getElementById('date-filter-menu');
            const dateFilterLabel = document.getElementById('date-filter-label');
            const exportMenu = document.getElementById('export-menu');
            const exportOptionsContainer = document.getElementById('export-options-container');
            const inputSection = document.getElementById('input-section');
            const reviewSection = document.getElementById('review-section');
            const formSlider = document.getElementById('form-slider');
            const tabInput = document.getElementById('tab-input');
            const tabReview = document.getElementById('tab-review');
            const badgeCount = document.getElementById('badge-count');
            const tableHead = document.getElementById('preview-table-head');
            const tableBody = document.getElementById('preview-table-body');
            const inputLayanan = document.getElementById('input-layanan');


            // --- LOGIKA AUTO-SELECT LAYANAN DARI URL ---
            const urlParams = new URLSearchParams(window.location.search);
            const layananParam = urlParams.get('layanan');

            if (layananParam) {
                const inputLayanan = document.getElementById('input-layanan');
                if (inputLayanan) {
                    for (let i = 0; i < inputLayanan.options.length; i++) {
                        if (inputLayanan.options[i].value === layananParam || inputLayanan.options[i].text === layananParam) {
                            inputLayanan.selectedIndex = i;
                            break;
                        }
                    }
                }
            }

            // --- LOGIKA FILTER TABEL ---
            const filterLayanan = document.getElementById('filter-layanan');
            // Isi opsi filter dari dropdown input
            Array.from(inputLayanan.options).forEach(option => {
                const newOption = document.createElement('option');
                newOption.value = option.value;
                newOption.textContent = option.value;
                filterLayanan.appendChild(newOption);
            });

            function applyFilters() {
                const selectedService = filterLayanan.value;
                const selectedDays = dateFilterMenu.querySelector('a.bg-gray-100')?.dataset.days || '*';

                const today = new Date();
                today.setHours(0, 0, 0, 0); // Set ke awal hari

                const cutoffDate = new Date(today);
                if (selectedDays !== '*') {
                    cutoffDate.setDate(today.getDate() - (parseInt(selectedDays, 10) - 1));
                }

                const rows = tableBody.querySelectorAll('tr.data-row');
                rows.forEach(row => {
                    const serviceCell = row.cells[1];
                    const dateCell = row.cells[3];
                    const rowDate = new Date(dateCell.innerText);
                    rowDate.setHours(0, 0, 0, 0);

                    const serviceMatch = selectedService === '*' || serviceCell.innerText === selectedService;
                    
                    let dateMatch = false;
                    if (selectedDays === '*') {
                        dateMatch = true;
                    } else if (selectedDays === '1') {
                        dateMatch = rowDate.getTime() === today.getTime();
                    } else {
                        dateMatch = rowDate >= cutoffDate && rowDate <= today;
                    }

                    if (serviceMatch && dateMatch) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
                updateFormHeight();
            }

            filterLayanan.addEventListener('change', applyFilters);

            let currentTab = 'input';
            let serviceChartInstance = null;
            let editingRow = null; // Menyimpan baris yang sedang diedit

            function updateFormHeight() {
                const activeSection = document.querySelector(`#${currentTab}-section`);
                // Sedikit delay untuk memastikan render layout selesai
                setTimeout(() => {
                    serviceForm.style.height = activeSection.offsetHeight + 'px';
                }, 50);
            }

            // Fungsi Ganti Tab
            function switchTab(tab) {
                currentTab = tab;
                if (tab === 'input') {
                    formSlider.style.transform = 'translateX(0%)';
                    tabInput.classList.add('active');
                    tabReview.classList.remove('active');
                } else if (tab === 'review') {
                    formSlider.style.transform = 'translateX(-100%)';
                    tabInput.classList.remove('active');
                    tabReview.classList.add('active');
                }
                updateFormHeight();
            }

            tabInput.addEventListener('click', () => switchTab('input'));
            tabReview.addEventListener('click', () => switchTab('review'));
            if (btnTambahLagi) btnTambahLagi.addEventListener('click', () => {
                editingRow = null; // Reset state edit
                btnTambahData.innerHTML = '+ Tambahkan ke Tabel Antrian';
                document.getElementById('input-nama').value = '';
                document.getElementById('input-tanggal').value = '';
                document.getElementById('input-desa').value = '';
                document.getElementById('input-umur').value = '';
                document.getElementById('input-telepon').value = '';
                document.getElementById('input-layanan').selectedIndex = 0;
                document.getElementById('input-jk').selectedIndex = 0;
                switchTab('input');
            });
            
            // Set tinggi awal & event listener resize
            updateFormHeight();
            window.addEventListener('resize', updateFormHeight);

            function updateBadge() {
                const count = tableBody.querySelectorAll('tr.data-row').length;
                if (count > 0) {
                    badgeCount.textContent = count;
                    badgeCount.classList.remove('hidden');
                } else {

            // --- FUNGSI CLOUD (JSONBIN.IO) ---
            async function saveDataToCloud() {
                const rows = [];
                document.querySelectorAll('#preview-table-body tr.data-row').forEach(row => {
                    const cells = row.querySelectorAll('td');
                    // Ambil data dari kolom (index 1 s/d 7)
                    rows.push({
                        layanan: cells[1].innerText,
                        nama: cells[2].innerText,
                        tanggal: cells[3].innerText,
                        desa: cells[4].innerText,
                        umur: cells[5].innerText,
                        jk: cells[6].innerText,
                        telepon: cells[7].innerText
                    });
                });

                try {
                    const response = await fetch(API_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY,
                            'X-Bin-Versioning': 'false'
                        },
                        body: JSON.stringify(rows)
                    });
                    
                    if (response.ok) {
                        console.log("Data berhasil disimpan ke JSONBin");
                    } else {
                        console.error("Gagal simpan ke JSONBin. Cek API Key Anda. Status:", response.status);
                    }

                    // Hanya jalankan Firebase jika kodenya sudah diisi yang asli (bukan dummy)
                    if (firebaseConfig.apiKey !== "API_KEY_FIREBASE_ANDA") {
                        await set(ref(db, 'antrian_layanan'), rows);
                        console.log("Data berhasil disimpan ke Firebase");
                    }
                } catch (error) {
                    console.error("Gagal menyimpan data ke Cloud:", error);
                }
            }

            // --- FUNGSI KIRIM KE GOOGLE SHEETS ---
            function submitToGoogleSheets(data) {
                if (!GOOGLE_SCRIPT_URL) {
                    console.warn("URL Google Script belum diisi. Data ditambahkan secara lokal namun belum dikirim ke Google Sheets.");
                    return;
                }
                if (GOOGLE_SCRIPT_URL.includes("docs.google.com/spreadsheets")) {
                    alert("SALAH URL: Anda memasukkan Link Spreadsheet. Yang dibutuhkan adalah Link Web App (berawalan https://script.google.com/...). Silakan Deploy ulang Apps Script Anda.");
                    console.warn("URL Google Script belum diset dengan benar.");
                    return;
                }
                
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Mode no-cors penting agar tidak diblokir browser
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                })
                .then(() => console.log("Data terkirim ke Google Sheets"))
                .catch(error => console.error("Gagal kirim ke Google Sheets:", error));
            }

            async function loadDataFromCloud() {
                try {
                    const response = await fetch(`${API_URL}/latest`, {
                        method: 'GET',
                        headers: {
                            'X-Master-Key': API_KEY
                        },
                        cache: 'no-store' // Mencegah browser menampilkan data usang (cache)
                    });

                    if (!response.ok) {
                        throw new Error("Gagal mengambil data dari server. Status: " + response.status);
                    }

                    const result = await response.json();
                    
                    // JSONBin v3 menyimpan data di dalam properti .record
                    const data = result.record; 
                    
                    if (Array.isArray(data)) {
                        // Pindahkan logika render tabel ke sini, setelah data siap
                        tableBody.innerHTML = ''; // Reset tabel
                        data.forEach(d => addRowToTable(d.layanan, d.nama, d.tanggal, d.desa, d.umur, d.jk, d.telepon));
                        updateBadge();
                        updateFormHeight();
                    }
                } catch (error) {
                    console.error("Gagal memuat data:", error);
                    throw error; // Lempar error agar data lokal (Local Storage) bisa dipanggil sebagai cadangan
                }
            }

            // --- FUNGSI EXPORT PDF DENGAN FILTER ---
            function generatePdf(filterService = null) {
                const allRows = tableBody.querySelectorAll('tr.data-row');
                if (allRows.length === 0) {
                    alert('Tabel antrian kosong. Silakan tambahkan data terlebih dahulu.');
                    return;
                }

                const filteredRows = filterService ? Array.from(allRows).filter(row => row.cells[1].innerText === filterService) : allRows;

                if (filteredRows.length === 0) {
                    alert(`Tidak ada data antrian untuk layanan "${filterService}".`);
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Header Dokumen
                doc.setFontSize(14);
                doc.text('PEMERINTAH KABUPATEN KEDIRI', 105, 15, { align: 'center' });
                doc.text('KECAMATAN PLEMAHAN', 105, 22, { align: 'center' });
                doc.setFontSize(12);
                const title = filterService ? `DAFTAR ANTRIAN - ${filterService}` : 'DAFTAR ANTRIAN PERMOHONAN LAYANAN';
                doc.text(title, 105, 32, { align: 'center', maxWidth: 180 });
                doc.line(15, 35, 195, 35);

                // Data Tabel
                const tableData = [];
                filteredRows.forEach((row, index) => {
                    const cells = row.querySelectorAll('td');
                    const queueNo = cells[0].innerText;
                    tableData.push([
                        queueNo, cells[1].innerText, cells[2].innerText, cells[3].innerText,
                        cells[4].innerText, cells[5].innerText, cells[6].innerText, cells[7].innerText
                    ]);
                });

                doc.autoTable({
                    startY: 40,
                    head: [['No. Antrian', 'Layanan', 'Nama', 'Tanggal', 'Desa', 'Umur', 'JK', 'No. HP']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [22, 163, 74] },
                    styles: { fontSize: 8 }
                });

                // Simpan PDF
                const dateStr = new Date().toISOString().slice(0, 10);
                const safeFilterName = filterService ? filterService.replace(/[^a-z0-9]/gi, '_').slice(0, 30) : 'Semua';
                doc.save(`Antrian-${safeFilterName}-${dateStr}.pdf`);
            }

                        message += `*[${queueNo}] ${cells[1].innerText}*%0A`;
                        message += `   - Nama: ${cells[2].innerText}%0A`;
                        message += `   - Tanggal: ${cells[3].innerText}%0A`;
                        message += `   - Desa: ${cells[4].innerText}%0A`;
                        message += `   - Umur: ${cells[5].innerText} tahun%0A`;
                        message += `   - JK: ${cells[6].innerText}%0A`;
                        message += `   - No. HP: ${cells[7].innerText}%0A%0A`;
                    });

                    message += "Mohon segera diproses. Terima kasih.";

                    // Buka WhatsApp (Ganti nomor sesuai kebutuhan)
                    window.open(`https://wa.me/6281234567890?text=${message}`, '_blank');
                });
            }

            // Load data saat halaman pertama kali dibuka
            loadDataFromCloud().catch(() => {
                console.warn("Gagal memuat dari server, menggunakan data lokal sementara.");
                loadDataFromLocal();
            });

            // --- LOGIKA TOMBOL KEMBALI KE ATAS ---
            const backToTopButton = document.getElementById('back-to-top');

            if (backToTopButton && scrollableContainer) {
                scrollableContainer.addEventListener('scroll', () => {
                    if (scrollableContainer.scrollTop > 300) {
                        backToTopButton.classList.add('visible');
                    } else {
                        backToTopButton.classList.remove('visible');
                    }
                });

                backToTopButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollableContainer.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        });
    </script>
</body>
</html>
